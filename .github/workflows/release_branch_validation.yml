name: Release Branch Validation

on:
  push:
    branches:
      - 'release/*'

  pull_request:
    branches:
      - 'release/*'
    types: [closed]  # Includes both merged and closed PRs, but restricted to merged PRs below

  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to validate'
        required: true
        default: 'release/1.6.0'
        type: string

jobs:
  # For workflow_dispatch, we need to create a separate workflow run on the target branch
  # This job will re-trigger the workflow on the correct branch if needed
  trigger-on-target-branch:
    name: Trigger on Target Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref_name != inputs.release_branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger workflow on target branch
        run: |
          gh workflow run release-branch-validation.yml \
            --ref ${{ inputs.release_branch }} \
            --field release_branch="${{ inputs.release_branch }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Workflow triggered
        run: |
          echo "Workflow has been triggered on branch: ${{ inputs.release_branch }}"
          echo "This run will exit now. Check the Actions tab for the new workflow run."

  checkout-and-log:
    name: Checkout and Log Branch Info
    # Skip if we're re-triggering on another branch
    if: github.event_name != 'workflow_dispatch' || github.ref_name == inputs.release_branch || (github.event_name == 'pull_request' && github.event.pull_request.merged)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Log branch
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub ref name: ${{ github.ref_name }}"

  release-branch-tests-debug:
    name: Release Branch Tests (Debug)
    needs: checkout-and-log
    # Runs on direct push, merged PR, or manual workflow dispatch on correct branch
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_macos_checks: true
      linux_os_versions: '["focal", "jammy", "noble", "rhel-ubi9", "amazonlinux2", "bookworm", "fedora39"]'
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.0", "6.1", "nightly-6.2", "nightly-main"]'
      enable_wasm_sdk_build: true
      enable_embedded_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-6.2", "nightly-main"]'

  release-branch-tests-release:
    name: Release Branch Tests (Release)
    needs: [checkout-and-log, release-branch-tests-debug]
    # Runs on direct push, merged PR, or manual workflow dispatch on correct branch
    if: github.event_name != 'pull_request' || github.event.pull_request.merged
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_macos_checks: true
      macos_build_command: "xcrun swift test -c release --enable-testable-imports"
      linux_build_command: "swift test -c release --enable-testable-imports"
      windows_build_command: "swift test -c release --enable-testable-imports"
      linux_os_versions: '["focal", "jammy", "noble", "rhel-ubi9", "amazonlinux2", "bookworm", "fedora39"]'
      enable_linux_static_sdk_build: true
      linux_static_sdk_versions: '["6.0", "6.1", "nightly-6.2", "nightly-main"]'
      linux_static_sdk_build_command: "swift build -c release"
      enable_wasm_sdk_build: true
      enable_embedded_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-6.2", "nightly-main"]'
      wasm_sdk_build_command: "swift build -c release"
